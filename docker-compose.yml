services:
  # Whatomate app
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: whatomate:local
    container_name: whatomate_app
    restart: unless-stopped
    ports:
      # Must match [server] port in config.toml (default 4747).
      - "${WHATOMATE_PORT:-4747}:${WHATOMATE_PORT:-4747}"
    networks:
      - whatomate
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      LD_LIBRARY_PATH: /usr/local/lib
    volumes:
      - ./uploads:/app/uploads:rw
      - ./audio:/app/audio:rw
      - ./config.toml:/app/config.toml:ro
      - ./piper-models:/opt/piper/custom:ro
    command: ["server", "-migrate", "-config", "/app/config.toml"]

  # PostgreSQL database
  db:
    image: postgres:17-alpine
    container_name: whatomate_db
    restart: unless-stopped
    networks:
      - whatomate
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whatomate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whatomate}
      POSTGRES_DB: ${POSTGRES_DB:-whatomate}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whatomate} -d ${POSTGRES_DB:-whatomate}"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - postgres-data:/var/lib/postgresql/data

networks:
  whatomate:

volumes:
  postgres-data:
