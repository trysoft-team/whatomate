services:
  # Whatomate app
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: whatomate:local
    container_name: whatomate_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - whatomate
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      LD_LIBRARY_PATH: /usr/local/lib
    volumes:
      - ./uploads:/app/uploads:rw
      - ./audio:/app/audio:rw
      - ./config.toml:/app/config.toml:ro
      - ./piper-models:/opt/piper/custom:ro
    command: ["server", "-migrate", "-config", "/app/config.toml"]

  # PostgreSQL database
  db:
    image: postgres:17-alpine
    container_name: whatomate_db
    restart: unless-stopped
    networks:
      - whatomate
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whatomate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whatomate}
      POSTGRES_DB: ${POSTGRES_DB:-whatomate}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whatomate} -d ${POSTGRES_DB:-whatomate}"]
      interval: 10s
      timeout: 5s
      retries: 6
    volumes:
      - postgres-data:/var/lib/postgresql/data

  # Redis
  redis:
    image: redis:7-alpine
    container_name: whatomate_redis
    restart: unless-stopped
    networks:
      - whatomate
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data

  # Pipecat realtime AI Call sidecar (optional).
  # Enable [pipecat] in config.toml and set auth_token to match PIPECAT_AUTH_TOKEN.
  pipecat:
    build:
      context: ./services/pipecat-bot
      dockerfile: Dockerfile
    image: whatomate-pipecat:local
    container_name: whatomate_pipecat
    restart: unless-stopped
    networks:
      - whatomate
    ports:
      - "127.0.0.1:7860:7860"
    environment:
      PIPECAT_AUTH_TOKEN: ${PIPECAT_AUTH_TOKEN:-dev-pipecat-secret}
      PIPECAT_HOST: 0.0.0.0
      PIPECAT_PORT: 7860
    profiles:
      - pipecat

networks:
  whatomate:

volumes:
  postgres-data:
  redis-data:
